name: SignPath sign
description: Upload files as a GitHub artifact, submit them to SignPath for signing and download the signed result

inputs:
  name:
    description: Base name for the unsigned artifact (must be unique per workflow run)
    required: true
  path:
    description: Files to sign (upload-artifact path syntax)
    required: true
  artifact-configuration-slug:
    description: SignPath artifact configuration slug
    required: true
  signing-policy-slug:
    description: SignPath signing policy slug
    required: true
  output-directory:
    description: Directory that receives the signed artifact contents
    required: true
  api-token:
    description: SignPath API token
    required: true
  organization-id:
    description: SignPath organization ID
    required: true
  project-slug:
    description: SignPath project slug
    required: true

runs:
  using: composite
  steps:
    - name: Upload unsigned artifact
      id: upload
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}-unsigned
        path: ${{ inputs.path }}
        if-no-files-found: error
    - name: Submit signing request to SignPath
      uses: signpath/github-action-submit-signing-request@v3
      with:
        api-token: ${{ inputs.api-token }}
        organization-id: ${{ inputs.organization-id }}
        project-slug: ${{ inputs.project-slug }}
        signing-policy-slug: ${{ inputs.signing-policy-slug }}
        artifact-configuration-slug: ${{ inputs.artifact-configuration-slug }}
        github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
        wait-for-completion: true
        output-artifact-directory: ${{ inputs.output-directory }}
