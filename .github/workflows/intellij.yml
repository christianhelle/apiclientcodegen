name: IntelliJ Plugin

on:
  push:
    paths:
      - "src/IntelliJ/**"
      - ".github/workflows/intellij.yml"
  pull_request:
    paths:
      - "src/IntelliJ/**"
      - ".github/workflows/intellij.yml"

env:
  VERSION: 1.44.${{ github.run_number }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Update Version
        working-directory: src/IntelliJ
        shell: pwsh
        run: |
          ((Get-Content -Path gradle.properties -Raw) `
            -Replace "pluginVersion=0.1.0", "pluginVersion=${{ env.VERSION }}") `
            | Set-Content -Path gradle.properties
      - name: Build IntelliJ Plugin
        working-directory: src/IntelliJ
        run: ./gradlew buildPlugin --no-daemon
      - name: Verify Plugin Compatibility
        working-directory: src/IntelliJ
        run: ./gradlew verifyPlugin --no-daemon
      - name: Sign Intellij-Plugin with SignPath
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: ./.github/actions/signpath-sign
        with:
          name: Intellij-Plugin
          path: 'src/IntelliJ/build/distributions/*.zip'
          artifact-configuration-slug: intellij-plugin
          signing-policy-slug: test-signing
          output-directory: signed
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      - name: Replace unsigned plugin with signed one
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        shell: pwsh
        run: Copy-Item signed/*.zip src/IntelliJ/build/distributions -Force
      - name: Archive plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: intellij-plugin
          path: src/IntelliJ/build/distributions/*.zip
