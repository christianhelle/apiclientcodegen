name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run - build and sign only, no tag, GitHub release, NuGet or marketplace publishing"
        type: boolean
        default: false
      skip_signing:
        description: "Skip SignPath signing and publish unsigned artifacts instead"
        type: boolean
        default: false
  push:
    branches:
      - "release"

env:
  VERSION: "1.45.0"
  NUGET_REPO_URL: "https://api.nuget.org/v3/index.json"

permissions:
  id-token: write
  contents: write
  actions: read

jobs:
  CLI:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sets environment variables - branch-name
        uses: christianhelle/branch-name@master
      - name: Sets environment variables - Nerdbank.GitVersioning
        uses: dotnet/nbgv@master
        with:
          setAllVars: true
      - name: Update Version
        run: ((Get-Content -Path Core/ApiClientCodeGen.Core/ApiClientCodeGen.Core.csproj -Raw) -Replace ">1.0.0<", ">${{ env.VERSION }}<") | Set-Content -Path Core/ApiClientCodeGen.Core/ApiClientCodeGen.Core.csproj
        working-directory: src
      - name: Build
        run: dotnet build -c Release /p:UseSourceLink=true src/Rapicgen.slnx -p:PackageVersion="${{ env.VERSION }}"
      - name: Package CLI Tool
        run: dotnet pack --no-build -c Release /p:UseSourceLink=true src/CLI/ApiClientCodeGen.CLI/ApiClientCodeGen.CLI.csproj -p:PackageVersion="${{ env.VERSION }}"
      - name: Collect CLI Tool package for signing
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force unsigned | Out-Null
          Get-ChildItem src/CLI -Recurse -Filter *.nupkg | Copy-Item -Destination unsigned
      - name: Sign CLI-Tool with SignPath
        if: ${{ !inputs.skip_signing }}
        timeout-minutes: 20
        uses: ./.github/actions/signpath-sign
        continue-on-error: true
        with:
          name: CLI-Tool
          path: unsigned/*.nupkg
          artifact-configuration-slug: cli-nuget
          signing-policy-slug: release-signing
          output-directory: signed
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      - name: Normalize CLI package for publishing
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish | Out-Null
          $signed = @(Get-ChildItem signed/*.nupkg -ErrorAction SilentlyContinue)
          if ($signed.Count -gt 0) {
            $signed | Copy-Item -Destination publish -Force
            $status = 'SIGNED'
          } else {
            Get-ChildItem unsigned/*.nupkg -ErrorAction SilentlyContinue | Copy-Item -Destination publish -Force
            $status = 'UNSIGNED'
            Write-Host "::warning::CLI package will be published UNSIGNED - SignPath signing was unavailable"
          }
          if (-not (Get-ChildItem publish/*.nupkg -ErrorAction SilentlyContinue)) {
            throw 'No CLI package staged in publish/'
          }
          Copy-Item docs/CLI.md publish -Force -ErrorAction SilentlyContinue
          "| Artifact | Signing |`n| --- | --- |`n| CLI package | **$status** |" >> $env:GITHUB_STEP_SUMMARY
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        if: ${{ !inputs.dry_run && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release') }}
        with:
          user: christian.helle
      - name: Push packages to NuGet
        if: ${{ !inputs.dry_run && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release') }}
        run: dotnet nuget push publish/*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source ${{ env.NUGET_REPO_URL }} --no-symbols true
        continue-on-error: true
      - name: Publish artifacts
        uses: actions/upload-artifact@v7
        with:
          name: CLI Tool
          path: publish/

  VSIX:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sets environment variables - branch-name
        uses: christianhelle/branch-name@master
      - name: Sets environment variables - Nerdbank.GitVersioning
        uses: dotnet/nbgv@master
        with:
          setAllVars: true
      - name: Update Version
        run: |
          ((Get-Content -Path Core/ApiClientCodeGen.Core/ApiClientCodeGen.Core.csproj -Raw) -Replace ">1.0.0<", ">${{ env.VERSION }}<") | Set-Content -Path Core/ApiClientCodeGen.Core/ApiClientCodeGen.Core.csproj
          ((Get-Content -Path VSIX/ApiClientCodeGen.VSIX.Extensibility/ApiClientCodeGen.VSIX.Extensibility.csproj -Raw) -Replace ">1.0.0<", ">${{ env.VERSION }}<") | Set-Content -Path VSIX/ApiClientCodeGen.VSIX.Extensibility/ApiClientCodeGen.VSIX.Extensibility.csproj
          ((Get-Content -Path VSIX/ApiClientCodeGen.VSIX/source.extension.vsixmanifest -Raw) -Replace "1.0.0", "${{ env.VERSION }}") | Set-Content -Path VSIX/ApiClientCodeGen.VSIX/source.extension.vsixmanifest
          ((Get-Content -Path VSIX/ApiClientCodeGen.VSIX.Dev17/source.extension.vsixmanifest -Raw) -Replace "1.0.0", "${{ env.VERSION }}") | Set-Content -Path VSIX/ApiClientCodeGen.VSIX.Dev17/source.extension.vsixmanifest
        working-directory: src
        shell: pwsh
      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v3
      - name: Restore
        run: msbuild VSIX.slnx -t:Restore
        working-directory: src
      - name: Build
        run: msbuild VSIX.slnx /property:Configuration=Release /p:DeployExtension=false
        working-directory: src
      - name: Move build output
        run: |
          mv src/VSIX/ApiClientCodeGen.VSIX/bin/Release/ApiClientCodeGenerator.vsix ApiClientCodeGenerator-VS2019-${{ env.VERSION }}.vsix
          mv src/VSIX/ApiClientCodeGen.VSIX.Dev17/bin/Release/ApiClientCodeGenerator.vsix ApiClientCodeGenerator-VS2022-${{ env.VERSION }}.vsix
          mv src/VSIX/ApiClientCodeGen.VSIX.Extensibility/bin/Release/net8.0/ApiClientCodeGen.VSIX.Extensibility.vsix ApiClientCodeGenerator-VS2026-${{ env.VERSION }}.vsix
      - name: Sign Visual-Studio-Extension with SignPath
        if: ${{ !inputs.skip_signing }}
        timeout-minutes: 20
        uses: ./.github/actions/signpath-sign
        continue-on-error: true
        with:
          name: Visual-Studio-Extension
          path: "*.vsix"
          artifact-configuration-slug: vsix
          signing-policy-slug: release-signing
          output-directory: signed
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      - name: Normalize VSIX packages for publishing
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish | Out-Null
          $expected = @(
            "ApiClientCodeGenerator-VS2019-${{ env.VERSION }}.vsix"
            "ApiClientCodeGenerator-VS2022-${{ env.VERSION }}.vsix"
            "ApiClientCodeGenerator-VS2026-${{ env.VERSION }}.vsix"
          )
          $signed = @(Get-ChildItem signed/*.vsix -ErrorAction SilentlyContinue)
          if ($signed.Count -gt 0) {
            $signed | Copy-Item -Destination publish -Force
            $status = 'SIGNED'
          } else {
            Get-ChildItem *.vsix -ErrorAction SilentlyContinue | Copy-Item -Destination publish -Force
            $status = 'UNSIGNED'
            Write-Host "::warning::Visual Studio extensions will be published UNSIGNED - SignPath signing was unavailable"
          }
          $missing = $expected | Where-Object { -not (Test-Path "publish/$_") }
          if ($missing) {
            throw "Missing staged VSIX: $($missing -join ', ')"
          }
          Copy-Item docs/Marketplace*.md publish -Force -ErrorAction SilentlyContinue
          "| Artifact | Signing |`n| --- | --- |`n| Visual Studio extensions | **$status** |" >> $env:GITHUB_STEP_SUMMARY
      - name: Publish artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Visual Studio Extension
          path: publish/
      - name: Publish VSIX Packages
        if: ${{ !inputs.dry_run && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release') }}
        continue-on-error: true
        run: |
          irm https://christianhelle.com/vsixpublisher/install.ps1 | iex
          & vsixpublisher publish -oidc -payload publish/ApiClientCodeGenerator-VS2022-${{ env.VERSION }}.vsix -publishManifest src/VSIX/publish-manifest-VS2022.json -ignoreWarnings 'VSIXValidatorWarning01,VSIXValidatorWarning02'
          & vsixpublisher publish -oidc -payload publish/ApiClientCodeGenerator-VS2026-${{ env.VERSION }}.vsix -publishManifest src/VSIX/publish-manifest-VS2026.json -ignoreWarnings 'VSIXValidatorWarning01,VSIXValidatorWarning02'

  VSCode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bump VSCode extension version
        run: |
          sed -i "s/\"version\": \".*\"/\"version\": \"${{ env.VERSION }}\"/" src/VSCode/package.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "6.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "src/VSCode/package-lock.json"

      - name: Install dependencies
        run: |
          cd src/VSCode
          npm ci

      - name: Lint
        run: |
          cd src/VSCode
          npm run lint

      - name: Build
        run: |
          cd src/VSCode
          npm run compile

      - name: Package Extension
        run: |
          cd src/VSCode
          npm run package
          npm run vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: VSCode-Extension
          path: src/VSCode/*.vsix

      - name: Check if already published to VS Code Marketplace
        id: vscode-check
        working-directory: src/VSCode
        run: |
          if npx vsce show ChristianResmaHelle.apiclientcodegen --json \
            | jq -e --arg v "${{ env.VERSION }}" '.versions | any(.version == $v)' > /dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::VS Code extension ${{ env.VERSION }} already published, skipping"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to VS Code Marketplace
        if: ${{ !inputs.dry_run && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release') && steps.vscode-check.outputs.published != 'true' }}
        run: |
          cd src/VSCode
          npx vsce publish -p ${{ secrets.MARKETPLACE_PAT }}

  IntelliJ:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}-${{ hashFiles('**/gradle.properties', '**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}-
      - name: Update Version
        working-directory: src/IntelliJ
        shell: pwsh
        run: |
          ((Get-Content -Path gradle.properties -Raw) `
            -Replace "pluginVersion=0.1.0", "pluginVersion=${{ env.VERSION }}") `
            | Set-Content -Path gradle.properties
      - name: Build IntelliJ Plugin
        working-directory: src/IntelliJ
        run: ./gradlew buildPlugin --no-daemon
      - name: Sign Intellij-Plugin with SignPath
        if: ${{ !inputs.skip_signing }}
        timeout-minutes: 20
        uses: ./.github/actions/signpath-sign
        continue-on-error: true
        with:
          name: Intellij-Plugin
          path: src/IntelliJ/build/distributions/*.zip
          artifact-configuration-slug: intellij-plugin
          signing-policy-slug: release-signing
          output-directory: signed
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      - name: Normalize IntelliJ plugin for publishing
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish | Out-Null
          $signed = @(Get-ChildItem signed/*.zip -ErrorAction SilentlyContinue)
          if ($signed.Count -gt 0) {
            $signed | Copy-Item -Destination publish -Force
            $status = 'SIGNED'
          } else {
            Get-ChildItem src/IntelliJ/build/distributions/*.zip -ErrorAction SilentlyContinue | Copy-Item -Destination publish -Force
            $status = 'UNSIGNED'
            Write-Host "::warning::IntelliJ plugin will be published UNSIGNED - SignPath signing was unavailable"
          }
          if (-not (Get-ChildItem publish/*.zip -ErrorAction SilentlyContinue)) {
            throw 'No IntelliJ plugin staged in publish/'
          }
          "| Artifact | Signing |`n| --- | --- |`n| IntelliJ plugin | **$status** |" >> $env:GITHUB_STEP_SUMMARY
      - name: Archive plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: Intellij-Plugin
          path: publish/
      - name: Check if already published to JetBrains Marketplace
        id: jetbrains-check
        shell: pwsh
        run: |
          $published = $false
          try {
            $plugin = Invoke-RestMethod "https://plugins.jetbrains.com/api/plugins/intellij/com.christianhelle.apiclientcodegen"
            $updates = Invoke-RestMethod "https://plugins.jetbrains.com/api/plugins/$($plugin.id)/updates?size=100"
            $published = [bool]($updates | Where-Object { $_.version -eq '${{ env.VERSION }}' })
          } catch { Write-Host "Lookup failed: $_" }
          "published=$($published.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($published) { "::notice::JetBrains plugin ${{ env.VERSION }} already published, skipping" }
      - name: Publish to JetBrains Marketplace
        if: ${{ !inputs.dry_run && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release') && steps.jetbrains-check.outputs.published != 'true' }}
        working-directory: src/IntelliJ
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        shell: pwsh
        run: |
          $stagedZip = (Get-ChildItem "$env:GITHUB_WORKSPACE/publish/*.zip" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $stagedZip) { throw 'No staged IntelliJ plugin zip found in publish/' }
          ./gradlew publishPlugin --no-daemon "-PsignedPluginZip=$stagedZip"

  Release:
    needs: [CLI, VSIX, VSCode, IntelliJ]
    if: ${{ !inputs.dry_run && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release') }}
    runs-on: ubuntu-latest
    steps:
      - name: Create tag
        uses: actions/github-script@v9
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release'
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "refs/tags/${{ env.VERSION }}",
              sha: context.sha
            })
      - name: Create release
        id: create-release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.VERSION }}
          release_name: v${{ env.VERSION }}
          draft: true
          prerelease: false
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Upload VSIX for VS 2019 asset
        if: always() && steps.create-release.outputs.upload_url != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: artifacts/Visual Studio Extension/ApiClientCodeGenerator-VS2019-${{ env.VERSION }}.vsix
          asset_name: ApiClientCodeGenerator-VS2019-${{ env.VERSION }}.vsix
          asset_content_type: application/zip
      - name: Upload VSIX for VS 2022 asset
        if: always() && steps.create-release.outputs.upload_url != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: artifacts/Visual Studio Extension/ApiClientCodeGenerator-VS2022-${{ env.VERSION }}.vsix
          asset_name: ApiClientCodeGenerator-VS2022-${{ env.VERSION }}.vsix
          asset_content_type: application/zip
      - name: Upload VSIX for VS 2026 asset
        if: always() && steps.create-release.outputs.upload_url != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: artifacts/Visual Studio Extension/ApiClientCodeGenerator-VS2026-${{ env.VERSION }}.vsix
          asset_name: ApiClientCodeGenerator-VS2026-${{ env.VERSION }}.vsix
          asset_content_type: application/zip
      - name: Upload VSCode asset
        if: always() && steps.create-release.outputs.upload_url != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: artifacts/VSCode-Extension/apiclientcodegen-${{ env.VERSION }}.vsix
          asset_name: apiclientcodegen-${{ env.VERSION }}.vsix
          asset_content_type: application/zip
      - name: Upload IntelliJ Plugin asset
        if: always() && steps.create-release.outputs.upload_url != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: artifacts/Intellij-Plugin/apiclientcodegen-intellij-${{ env.VERSION }}.zip
          asset_name: apiclientcodegen-intellij-${{ env.VERSION }}.zip
          asset_content_type: application/zip
