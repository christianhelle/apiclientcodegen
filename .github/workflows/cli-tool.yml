name: CLI Tool

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**/*'
      - '!.github/workflows/cli-tool.yml'
      - '!src/Core/**/*.csproj'
      - '!src/Core/**/*.cs'
      - '!src/CLI/**/*.csproj'
      - '!src/CLI/**/*.cs'
  pull_request:
    paths-ignore:
      - '**/*'
      - '!.github/workflows/cli-tool.yml'
      - '!src/Core/**/*.csproj'
      - '!src/Core/**/*.cs'
      - '!src/CLI/**/*.csproj'
      - '!src/CLI/**/*.cs'
  schedule:
    - cron:  '0 8 * * *'

env:
  VERSION: 1.42.${{ github.run_number }}

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - name: Sets environment variables - branch-name
      uses: christianhelle/branch-name@master
    - name: Sets environment variables - Nerdbank.GitVersioning
      uses: dotnet/nbgv@master

    - name: Update Version
      run: ((Get-Content -Path Core/ApiClientCodeGen.Core/ApiClientCodeGen.Core.csproj -Raw) -Replace ">1.0.0<", ">${{ env.VERSION }}<") | Set-Content -Path Core/ApiClientCodeGen.Core/ApiClientCodeGen.Core.csproj
      working-directory: src

    - name: Build with dotnet
      run: dotnet build Rapicgen.slnx
      working-directory: src
    
    - name: Build
      run: dotnet build -c Release /p:UseSourceLink=true src/Rapicgen.slnx -p:PackageVersion="${{ env.VERSION }}"

    - name: Core test project
      run: dotnet test --no-build src/Core/ApiClientCodeGen.Core.Tests/ApiClientCodeGen.Core.Tests.csproj
      continue-on-error: true

    - name: Package
      run: dotnet pack --no-build -c Release /p:UseSourceLink=true src/CLI/ApiClientCodeGen.CLI/ApiClientCodeGen.CLI.csproj -p:PackageVersion="${{ env.VERSION }}"

    - name: Collect CLI Tool package for signing
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force unsigned | Out-Null
        Get-ChildItem src/CLI -Recurse -Filter *.nupkg | Copy-Item -Destination unsigned
    - name: Sign CLI-Tool with SignPath
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
      uses: ./.github/actions/signpath-sign
      with:
        name: CLI-Tool
        path: 'unsigned/*.nupkg'
        artifact-configuration-slug: cli-nuget
        signing-policy-slug: test-signing
        output-directory: signed
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
    - name: Replace unsigned package with signed one
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
      shell: pwsh
      run: Copy-Item signed/*.nupkg src/CLI/ApiClientCodeGen.CLI/bin/Release -Force

    - name: Publish artifacts
      uses: actions/upload-artifact@v7
      with:
        name: CLI Tool
        path: |
          **/*.nupkg
          docs/CLI.md
